[project]
name = "kickbase-auto-manager"
version = "0.1.0"
description = "Dockerisierter KI-Auto-Manager für Kickbase"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "cryptography>=43",
    "aiosmtplib>=3.0",
    "anthropic>=0.39",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "vcrpy>=6.0",
    "types-python-dateutil",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async antipatterns
    "S",             # bandit
    "PL",            # pylint
]
ignore = [
    "S101",   # assert used (pytest)
    "PLR0913",# too many args (FastAPI DI)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/domain", "app/application"]

[[tool.mypy.overrides]]
module = "app.infrastructure.*"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py"]
